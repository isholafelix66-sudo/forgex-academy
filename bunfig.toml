# Bun package-manager configuration.
#
# Context: the deploy build container runs on a single virtiofs mount, where
# bun's default `--backend=hardlink` materialization intermittently fails
# part-way through a cold install:
#
#   FileNotFound: failed copying files from cache to destination for package X
#   Failed to install N packages            (bun exits 1 -> the build aborts)
#
# The install step itself is what fixes that: "installCommand" in vercel.json
# runs scripts/install-deps.mjs, which installs with `--backend=copyfile`
# (plain copies, no hardlinks) and only exits 0 once the tree is verified
# complete. `--backend` has no bunfig equivalent — every bunfig spelling still
# hardlinks — so it must be passed on the command line.
#
# This file keeps bun's download cache OUT of the workspace so a from-scratch
# node_modules rebuild in the install step never discards it, and so no cache
# state is ever carried inside the synced tree. It is content-addressed; a
# cold container simply repopulates it.
[install.cache]
dir = "/tmp/forgex-bun-cache"
