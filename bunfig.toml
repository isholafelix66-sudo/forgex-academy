# Bun package-manager configuration.
#
# Failure mode (deploy builds)
# -----------------------------
# The deploy image runs a bare `bun install` with bun 1.3.14, whose cache →
# node_modules materialization intermittently dies with
#
#   FileNotFound: failed copying files from cache to destination for package X
#   Failed to install N packages            (bun exits 1 → the build aborts)
#
# (oven-sh/bun#37830, fixed upstream in bun 1.4.0). The project's own install
# step (scripts/install-deps.mjs, used by vercel.json) already avoids this by
# using a private cache + --backend=copyfile, but the platform's bare install
# runs WITHOUT those flags, so this file is its only configuration.
#
# What bun 1.3.14 actually honors here (verified empirically on this image):
#
#   [install.cache] dir = "/tmp/forgex-bun-cache"   ✅ honored
#     → downloads land OUTSIDE the synced workspace. This matters because a
#       workspace-local cache (node_modules/.cache) used to grow to ~520 MB of
#       hardlink sources; any torn entry in it poisoned every later install
#       ("failed copying files from cache to destination"). /tmp is fresh per
#       build container, so a damaged cache can never persist between builds.
#
#   [install.cache] disable = true                  ❌ NOT honored
#     → bun 1.3.14 ignores `disable` AND, when it is set, also ignores `dir`
#       (cache regressed to node_modules/.cache). Do not re-add it.
#
#   [install] backend = "copyfile"                  ❌ NOT honored (no-op)
#     → 1.3.14 always materializes via hardlink from the cache. The key is
#       kept anyway: it is harmless there, and it makes bun ≥ 1.4 installs
#       (install-deps.mjs, local dev) take the copyfile path, which has never
#       failed on this filesystem. If a bare 1.3.14 install still fails after
#       the /tmp cache move, the residual risk is the hardlink backend itself;
#       the postinstall hook (scripts/install-tsc-wrapper.mjs) then heals the
#       damaged packages in the same install run.
#
# scripts/install-deps.mjs keeps its own CLI flags and private cache; its
# flags take precedence over this file and its behavior is unchanged.

[install]
backend = "copyfile"

[install.cache]
dir = "/tmp/forgex-bun-cache"
