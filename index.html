<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f0e" />
  <meta
    name="description"
    content="ForgeX Academy — the learning platform of ForgeX Network. Discover skills, express yourself and build the career you want with structured paths, verified tutors and certificates."
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ForgeX" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <title>ForgeX Academy — Discover. Express. Build.</title>

  <script>
    // Paint the saved theme BEFORE first paint: without this every navigation
    // that reboots the app flashes electric-black for a frame in light mode,
    // which reads as "the page is refreshing". Inline because CSP allows it
    // (vercel.json sets no Content-Security-Policy).
    (function () {
      try {
        var t = localStorage.getItem("forgex-theme");
        var root = document.documentElement;
        if (t === "light") {
          root.classList.add("light");
          root.classList.remove("dark");
        } else {
          root.classList.add("dark");
          root.classList.remove("light");
        }
      } catch (e) {
        /* storage unavailable — React applies the default on mount */
      }
    })();
  </script>

  <!-- Fonts: preconnect removes the TLS handshake. The stylesheet is a
       plain link (no inline onload handler) so it also loads when the strict
       Content-Security-Policy in vercel.json applies — inline event handlers
       are blocked by `script-src 'self'` and would silently kill the font
       load on the deployed site. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
